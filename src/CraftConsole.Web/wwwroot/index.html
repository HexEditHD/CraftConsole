<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftConsole</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%2310B981'/%3E%3Crect x='2' y='16' width='28' height='14' rx='7' fill='%23065F46'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23064E3B'/%3E%3Crect x='18' y='9' width='5' height='5' fill='%23064E3B'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-text">
          <span class="brand-name">CraftConsole</span>
          <span class="brand-sub">Server panel</span>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span id="conn-dot" class="conn-dot" title="Connecting…"></span>
        <span id="conn-label">Connecting…</span>
      </div>
    </aside>

    <div id="main">
      <header id="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div id="topbar-cluster"></div>
      </header>
      <div id="banner-slot"></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
