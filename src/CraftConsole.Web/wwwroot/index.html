<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftConsole</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%239184d9'/%3E%3Crect x='2' y='16' width='28' height='14' rx='7' fill='%235d5294'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23161826'/%3E%3Crect x='18' y='9' width='5' height='5' fill='%23161826'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="brand">
        <div class="brand-mark">
          <span id="brand-icon"></span>
        </div>
        <span class="brand-name">CraftConsole</span>
      </div>
      <button id="profile-btn" class="profile-btn" title="Manage server profiles">
        <span id="profile-dot" class="profile-dot"></span>
        <span id="profile-name" class="profile-name">No profile</span>
        <span id="profile-meta" class="profile-meta"></span>
        <span id="profile-caret"></span>
      </button>
      <div id="vitals-slot" class="vitals-strip"></div>
      <div class="header-right">
        <button id="issues-bell" class="icon-btn hairline" title="Issues" aria-label="Issues">
          <span id="bell-icon"></span>
          <span id="issues-badge" class="count-badge" style="display:none">0</span>
        </button>
        <div id="server-toggle-slot"></div>
      </div>
    </header>
    <hr class="rule-fade">

    <div id="body">
      <div id="rail-wrap">
        <nav id="rail"></nav>
        <div id="rail-foot">
          <span id="conn-dot" class="conn-dot" title="Connecting…"></span>
          <button id="sign-out-btn" class="btn ghost sm icon-only" title="Sign out"></button>
        </div>
      </div>
      <div id="content-col">
        <div id="title-block">
          <h1 id="page-title"></h1>
          <span id="page-subtitle" class="page-subtitle"></span>
        </div>
        <div id="banner-slot"></div>
        <main id="view" tabindex="-1"></main>
      </div>
    </div>
  </div>

  <nav id="phone-tabs"></nav>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
