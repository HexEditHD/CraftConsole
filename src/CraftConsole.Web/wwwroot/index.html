<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftConsole</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f7f9fb'/%3E%3Cpath d='M16 5.5 25.5 11v10L16 26.5 6.5 21V11Z' fill='none' stroke='%231f5fd0' stroke-width='1.6'/%3E%3Cpath d='M16 16 25.5 11M16 16 6.5 11M16 16v10.5' fill='none' stroke='%231f5fd0' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span id="brand-icon"></span>
        <span class="brand-name">CraftConsole</span>
      </div>
      <nav id="nav"></nav>
      <div id="sidebar-foot">
        <span id="conn" class="conn" title="Connecting…"></span>
        <span id="conn-label">Connecting…</span>
        <span class="spacer"></span>
        <button id="signout" class="btn ghost sm icon-only" title="Sign out" aria-label="Sign out"></button>
      </div>
    </aside>

    <div id="main">
      <!-- Title block, as on an engineering drawing: what the sheet is,
           and its current readings, in ruled cells. -->
      <header id="titleblock">
        <div class="tb-cell tb-main">
          <h1 id="page-title"></h1>
          <div id="page-sub"></div>
        </div>
        <div id="server-switch" class="tb-cell"></div>
        <div id="readings" class="readings"></div>
        <div id="controls" class="controls"></div>
      </header>
      <div id="banner-slot"></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <nav id="mobile-nav"></nav>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
