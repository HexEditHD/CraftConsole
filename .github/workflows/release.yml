name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}          # e.g. v1.2.3
          VERSION=${TAG#v}               # strip leading 'v' → 1.2.3
          echo "tag=$TAG"       >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish (win-x64, self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish src/CraftConsole.Web/CraftConsole.Web.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.ver.outputs.version }} `
            --output ./publish

      - name: Zip artifact
        shell: pwsh
        run: |
          $zip = "CraftConsole-${{ steps.ver.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path ./publish/* -DestinationPath $zip
          echo "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CraftConsole ${{ steps.ver.outputs.tag }}"
          generate_release_notes: true
          files: ${{ env.ZIP }}
